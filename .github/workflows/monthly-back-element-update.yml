name: Alle back-Elemente neu rechnen (monatlich)

on:
  schedule:
    # Läuft am 1. jeden Monats um 2:00 UTC
    - cron: '0 2 1 * *'
  workflow_dispatch: # Ermöglicht manuellen Start

jobs:
  update-back-elements:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Vollständige Git-Historie für Änderungserkennung
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests lxml
    
    - name: Cache PMB files
      uses: actions/cache@v3
      with:
        path: python-temp/
        key: pmb-files-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          pmb-files-
    
    - name: Check for changes in editions folder in the last month
      id: check-changes
      run: |
        # Datum vor einem Monat berechnen
        LAST_MONTH=$(date -d "1 month ago" +%Y-%m-%d)
        echo "Checking for changes since: $LAST_MONTH"
        
        # Prüfen ob es Änderungen in ./editions/ seit dem letzten Monat gab
        CHANGES=$(git log --since="$LAST_MONTH" --oneline --name-only -- editions/ | wc -l)
        echo "Found $CHANGES changes in editions/ folder"
        
        if [ $CHANGES -eq 0 ]; then
          echo "No changes found in editions/ folder since $LAST_MONTH"
          echo "has_changes=false" >> $GITHUB_OUTPUT
        else
          echo "Changes found in editions/ folder since $LAST_MONTH"
          echo "has_changes=true" >> $GITHUB_OUTPUT
          
          # Liste der geänderten Dateien für das Commit-Message
          git log --since="$LAST_MONTH" --name-only --pretty=format: -- editions/ | sort | uniq | head -10 > changed_files.txt
          echo "Changed files (first 10):"
          cat changed_files.txt
        fi
    
    - name: Run back element batch processing
      if: steps.check-changes.outputs.has_changes == 'true'
      timeout-minutes: 300  # Gesamt-Timeout für diesen Step (5 Stunden)
      continue-on-error: true  # Workflow soll auch bei Timeouts oder Fehlern weiterlaufen
      run: |
        echo "Starting batch processing of back elements..."
        echo "📥 Step 1: Downloading/checking PMB lists (listperson.xml, listbibl.xml, etc.)..."
        echo "⚙️  Step 2: Processing XML files with back element enrichment..."
        echo "🔄 Step 3: Running parallel processing on editions/ folder..."
        echo ""
        python python/batch_process_back-element.py --parallel 6 || echo "Batch processing finished with some errors/timeouts, but continuing..."
        echo "Batch processing step completed"
    
    - name: Check for actual file changes after processing
      if: always() && steps.check-changes.outputs.has_changes == 'true'  # Läuft auch bei Fehlern im vorherigen Step
      id: check-git-changes
      run: |
        # Prüfen ob das Script tatsächlich Dateien geändert hat
        git add -A
        if git diff --staged --quiet; then
          echo "No files were actually modified by the script"
          echo "files_changed=false" >> $GITHUB_OUTPUT
        else
          echo "Files were modified by the script"
          echo "files_changed=true" >> $GITHUB_OUTPUT
        fi
    
    - name: Configure Git
      if: always() && steps.check-git-changes.outputs.files_changed == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
    
    - name: Commit and push changes
      if: always() && steps.check-git-changes.outputs.files_changed == 'true'
      run: |
        # Erstelle Commit-Message mit Zusammenfassung
        CURRENT_DATE=$(date +%Y-%m-%d)
        CHANGED_COUNT=$(git status --porcelain | wc -l)
        
        cat > commit_message.txt << EOF
        Monthly back element update - $CURRENT_DATE
        
        Automatically updated back elements for $CHANGED_COUNT files
        based on changes in editions/ folder from the previous month.
        
        🤖 Generated by monthly workflow
        ⚙️ Processed with python/batch_process_back-element.py
        📊 PMB data enrichment and post-processing applied
        
        Changes detected since: $(date -d "1 month ago" +%Y-%m-%d)
        EOF
        
        # Commit mit der generierten Message
        git commit -F commit_message.txt
        
        echo "Committed changes, attempting to push..."
        git push
        
        echo "✅ Successfully pushed back element updates"
    
    - name: Create workflow summary
      if: always()
      run: |
        echo "# Monthly Back Element Update Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Date:** $(date +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
        echo "**Time:** $(date +%H:%M:%S) UTC" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ steps.check-changes.outputs.has_changes }}" == "true" ]; then
          echo "✅ **Changes detected** in editions/ folder from the last month" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check-git-changes.outputs.files_changed }}" == "true" ]; then
            CHANGED_COUNT=$(git status --porcelain | wc -l || echo "unknown")
            echo "✅ **Files updated:** $CHANGED_COUNT files processed and committed" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Status:** Back elements successfully updated and pushed" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ **Files updated:** No actual changes after processing" >> $GITHUB_STEP_SUMMARY
            echo "ℹ️ **Status:** No commit needed - all back elements were already up to date" >> $GITHUB_STEP_SUMMARY
          fi
        else
          echo "ℹ️ **No changes** detected in editions/ folder from the last month" >> $GITHUB_STEP_SUMMARY
          echo "⏭️ **Status:** Skipped processing - no updates needed" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "---" >> $GITHUB_STEP_SUMMARY
        echo "*This workflow runs automatically on the 1st of each month at 4:00 AM UTC*" >> $GITHUB_STEP_SUMMARY
    
    - name: Notify on failure
      if: failure()
      run: |
        echo "❌ Monthly back element update failed!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Please check the workflow logs for details." >> $GITHUB_STEP_SUMMARY
        echo "The workflow can be manually re-run from the Actions tab." >> $GITHUB_STEP_SUMMARY
